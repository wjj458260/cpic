<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="x5-orientation" content="portrait">
<title>核损施救费计算</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:12px;background:#f5f7fa;font-size:15px;color:#333;-webkit-tap-highlight-color:transparent}
.主{最大宽度:520px;边距:0 自动;背景:#fff;边框半径:12px;内边距:18px 16px 20px;盒子阴影:0 2px 10px #00000012}
.标题{文本对齐:居中;字体大小:19px;字体粗细:加粗;底部边距:18px;颜色:#222}
.项{下边距:16px}
标签{显示:块级元素;下边距:6像素;字体大小:14像素;颜色:#444;字体粗细:600}
选择,.文本{宽度:100%;高度:46像素;内边距:0 12像素;边框:1像素 实线#ddd;圆角半径:8像素;字体大小:16像素;背景:#fff;color:#222}
.txt{-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
选择:焦点,.文本:焦点{轮廓:无;边框颜色:#007aff}
#calcBtn{宽度:100%;高度:50px;背景颜色:#007aff;文字颜色:#fff;边框:无;圆角半径:8px;字体大小:17px;上边距:6px;-webkit-外观:无;外观:无;触摸操作:操控}
#calcBtn:active{background:#0062cc}
input.pick{background:#fff;cursor:pointer;-webkit-user-select:none;user-select:none}
.pad-mask{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:#00000055;z-index:99}
.pad{position:absolute;left:0;right:0;bottom:0;background:#f7f7f7;border-radius:14px 14px 0 0;padding:8px 10px 12px;box-shadow:0 -2px 14px #00000022}
.pad-head{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 6px}
.pad-title{font-size:14px;color:#666}
.pad-close{font-size:14px;color:#007aff;padding:6px 4px}
.pad-val{text-align:right;font-size:26px;font-weight:bold;color:#222;padding:4px 10px 10px;border-bottom:1px solid #e2e2e2;min-height:42px}
#padUnit{font-size:14px;color:#888;font-weight:normal;margin-left:5px}
.pad-keys,.pad-foot{display:flex;flex-wrap:wrap;margin:0 -4px}
.pad-foot{margin-top:2px}
.pk{flex:0 0 33.3333%;max-width:33.3333%;padding:4px}
.pad-foot .pk{flex:0 0 50%;max-width:50%}
.pk button{width:100%;height:48px;margin:0;padding:0;border:none;border-radius:8px;background:#fff;color:#222;font-size:22px;box-shadow:0 1px 0 #dcdcdc;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.pk button:active{background:#e6f0ff}
.pad-foot .pk button{font-size:17px}
#padClear{background:#f0f0f0;color:#444}
#padOk{background:#007aff;color:#fff}
.road-row{display:flex;align-items:center;padding:10px 12px;border:1px solid #e5e5e5;border-radius:8px;margin-bottom:8px;background:#fafafa}
.road-row.on{border-color:#007aff;background:#f0f9ff}
.road-cb{width:20px;height:20px;flex:0 0 20px;margin:0 10px 0 0}
.road-name{flex:1 1 auto;font-size:14px;line-height:1.35;color:#333;padding-right:8px}
.road-km{width:84px;flex:0 0 84px;height:38px;text-align:center;padding:0 6px;font-size:16px}
.road-km:disabled{background:#f0f0f0;color:#bbb;border-color:#e8e8e8}
.hint{font-size:12px;color:#999;line-height:1.6;margin-top:4px}
.two{display:flex;align-items:center}
.two span{flex:0 0 52px;font-size:14px;color:#444}
.two .txt{flex:1 1 auto;text-align:center}
.two em{flex:0 0 30px;text-align:right;font-style:normal;font-size:13px;color:#888}
.err{display:none;margin-top:12px;padding:10px 12px;background:#fff1f0;border:1px solid #ffccc7;color:#d4380d;border-radius:8px;font-size:14px;line-height:1.6}
.result{display:none;margin-top:16px;padding:14px;background:#f0f9ff;border-radius:10px;font-size:14px;line-height:1.8;color:#333}
.result .ln{margin-bottom:1px}
.result .sub{padding-left:10px;color:#555}
.result .hd{font-weight:bold;color:#222;margin-top:8px}
.total{font-size:18px;font-weight:bold;color:#ff3b30;margin-top:10px;padding-top:10px;border-top:1px dashed #cfe6f7}
.warn{color:red;font-weight:bold;margin-top:10px;animation:flash 1s infinite alternate}
@keyframes flash{from{opacity:1}to{opacity:.4}}
</style>
</head>
<body>
<div class="main">
  <div class="title">核损施救费计算</div>

  <div class="item">
    <label>选择机构（地区）</label>
    <select id="area"></select>
  </div>

  <div class="item">
    <label>选择施救车辆（具体车型）</label>
    <select id="car"></select>
  </div>

  <div class="item">
    <label>选择道路类型（可多选，跨路段分别填公里数）</label>
    <div id="roadBox"></div>
    <div class="hint">勾选本次施救实际经过的道路，点公里数框用页面数字键盘输入该段公里数；不经过的不用勾。</div>
  </div>

  <div class="item">
    <label>施救方式（拖车 / 吊车）及台数</label>
    <div class="two" style="margin-bottom:8px">
      <span>拖车</span>
      <input type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" class="txt" id="tow" placeholder="点击输入">
      <em>台</em>
    </div>
    <div class="two">
      <span>吊车</span>
      <input type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" class="txt" id="crane" placeholder="点击输入">
      <em>台</em>
    </div>
    <div class="hint">台数仅作案件登记，不参与施救费计算；不需要的留空即可。</div>
</div>

  <div id="err" class="err"></div>

  <button type="button" id="calcBtn">立即计算施救费</button>

  <div id="result" class="result"></div>
</div>

<div id="padMask" class="pad-mask">
  <div class="pad">
    <div class="pad-head">
      <span class="pad-title" id="padTitle">输入数值</span>
      <span class="pad-close" id="padClose">关闭</span>
    </div>
    <div class="pad-val"><span id="padNum">0</span><span id="padUnit">公里</span></div>
    <div class="pad-keys" id="padKeys">
      <div class="pk"><button type="button" data-k="1">1</button></div>
      <div class="pk"><button type="button" data-k="2">2</button></div>
      <div class="pk"><button type="button" data-k="3">3</button></div>
      <div class="pk"><button type="button" data-k="4">4</button></div>
      <div class="pk"><button type="button" data-k="5">5</button></div>
      <div class="pk"><button type="button" data-k="6">6</button></div>
      <div class="pk"><button type="button" data-k="7">7</button></div>
      <div class="pk"><button type="button" data-k="8">8</button></div>
<div class="pk"><button type="button" data-k="9">9</button></div>
      <div class="pk"><button type="button" data-k=".">.</button></div>
      <div class="pk"><button type="button" data-k="0">0</button></div>
      <div class="pk"><button type="button" data-k="del">&#9003;</button></div>
    </div>
    <div class="pad-foot">
      <div class="pk"><button type="button" id="padClear">清空</button></div>
      <div class="pk"><button type="button" id="padOk">确定</button></div>
    </div>
  </div>
</div>

var ROADS = ["高速公路","普通公路（城区）","普通公路（乡镇、山区）","普通公路"];

function parseNum(v){
  var t = (v === null || v === undefined) ? "" : String(v);
  t = t.replace(/[\uFF10-\uFF19]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
.replace(/[\uFF0E\u3002\uFF61]/g, ".")
       .replace(/[^0-9.]/g, "");
  var i = t.indexOf(".");
  if(i >= 0){ t = t.slice(0, i + 1) + t.slice(i + 1).replace(/\./g, ""); }
  if(t === "" || t === ".") return NaN;
  var n = parseFloat(t);
  return isFinite(n) ? n : NaN;
}

function el(id){ return document.getElementById(id); }

function addOption(sel, value, text){
  var o = document.createElement("option");
  o.value = value; o.textContent = text;
  sel.appendChild(o);
  return o;
}

function init(){
  var areaEl = el("area");
  addOption(areaEl, "", "请选择机构（地区）");
  for(var name in data){ addOption(areaEl, name, name); }
  areaEl.value = "";
  areaEl.addEventListener("change", onAreaChange);
  el("car").addEventListener("change", onCarChange);
  el("calcBtn").addEventListener("click", calc);
  initPad();
  bindNumInput(el("tow"), "拖车台数", "台");
  bindNumInput(el("crane"), "吊车台数", "台");
  updateCar();
  renderRoads();
}

function onAreaChange(){
  updateCar();
  renderRoads();
}

function onCarChange(){
renderRoads();
}

function updateCar(){
  var area = el("area").value;
  var carEl = el("car");
  carEl.innerHTML = "";
  if(!area || !data[area]){
    addOption(carEl, "", "请先选择机构");
    carEl.value = "";
    return;
  }
  addOption(carEl, "", "请选择施救车辆车型");
  for(var name in data[area]){ addOption(carEl, name, name); }
  carEl.value = "";
}

function currentRules(){
  var area = el("area").value;
  var car = el("car").value;
  if(!area || !car) return null;
  if(!data[area] || !data[area][car]) return null;
  return data[area][car];
}

function renderRoads(){
  var box = el("roadBox");
  var area = el("area").value;
  var car = el("car").value;
  box.innerHTML = "";
  if(!area){ box.innerHTML = '<div class="hint">请先选择机构（地区）</div>'; return; }
  if(!car){ box.innerHTML = '<div class="hint">请先选择施救车辆车型</div>'; return; }
  var rules = currentRules();
  if(!rules){ box.innerHTML = '<div class="hint">当前机构/车型暂无收费标准</div>'; return; }
  var any = false;
  ROADS.forEach(function(road){
    if(!rules[road]) return;
any = true;
    var row = document.createElement("div");
    row.className = "road-row";
    row.setAttribute("data-road", road);

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "road-cb";

    var nm = document.createElement("div");
    nm.className = "road-name";
    nm.textContent = road;

    var km = document.createElement("input");
    km.type = "text";
    km.className = "txt road-km";
    km.setAttribute("inputmode", "decimal");
    km.setAttribute("autocomplete", "off");
    km.setAttribute("autocorrect", "off");
    km.setAttribute("spellcheck", "false");
    km.setAttribute("enterkeyhint", "done");
    km.placeholder = "点此输入";
    km.disabled = true;

    cb.addEventListener("change", function(){
      row.className = "road-row" + (cb.checked ? " on" : "");
      km.disabled = !cb.checked;
      if(!cb.checked) km.value = "";
    });

    row.addEventListener("click", function(e){
      if(e.target === km || e.target === cb) return;
cb.checked = !cb.checked;
      cb.dispatchEvent(new Event("change"));
    });

    bindNumInput(km, road + " 公里数", "公里");
    row.appendChild(cb);
    row.appendChild(nm);
    row.appendChild(km);
    box.appendChild(row);
  });
  if(!any){ box.innerHTML = '<div class="hint">当前机构/车型暂无道路类型标准</div>'; }
}

function showErr(msg){
  var e = el("err");
  e.textContent = msg;
  e.style.display = "block";
}

function clearErr(){
  var e = el("err");
  e.textContent = "";
  e.style.display = "none";
}

function calc(){
  clearErr();
  var area = el("area").value;
  var car = el("car").value;
  if(!area){ showErr("请先选择机构（地区）"); return; }
  if(!car){ showErr("请先选择施救车辆车型"); return; }
  var rules = currentRules();
  if(!rules){ showErr("当前机构/车型暂无收费标准，请重新选择"); return; }

  var rows = document.querySelectorAll("#roadBox .road-row");
  var segs = [];
  var bad = "";
  for(var i = 0; i < rows.length; i++){
    var row = rows[i];
    var road = row.getAttribute("data-road");
    var cb = row.querySelector(".road-cb");
var kmEl = row.querySelector(".road-km");
    if(!cb.checked) continue;
    var km = parseNum(kmEl.value);
    if(isNaN(km) || km < 0){ if(!bad) bad = "请填写「" + road + "」的公里数"; continue; }
    if(km === 0) continue;
    segs.push({ road: road, km: km, rule: rules[road], free: 0, over: 0, extra: 0 });
  }
  if(bad){ showErr(bad); return; }
  if(!segs.length){ showErr("请至少勾选一种道路类型，并填写该段公里数"); return; }

  var totalKm = 0;
  for(var j = 0; j < segs.length; j++) totalKm += segs[j].km;

  // 起步价：取所选道路中起步价最高的一档，只计一次
  var base = segs[0];
  for(var m = 1; m < segs.length; m++){
    var s = segs[m];
    if(s.rule.s > base.rule.s || (s.rule.s === base.rule.s && s.rule.p > base.rule.p)) base = s;
  }
  var startFee = base.rule.s;
  var freeKm = base.rule.k;

  // 免费里程只抵扣一次，优先抵扣单价最高的一段
  var order = segs.slice().sort(function(a, b){ return b.rule.p - a.rule.p; });
  var remain = freeKm;
  var extraTotal = 0;
  for(var k = 0; k < order.length; k++){
    var g = order[k];
    g.free = Math.min(remain, g.km);
remain -= g.free;
    g.over = g.km - g.free;
    g.extra = g.over * g.rule.p;
    extraTotal += g.extra;
  }
  var total = startFee + extraTotal;

  // 拖车 / 吊车：仅登记，不计费
  var tow = parseNum(el("tow").value);
  var crane = parseNum(el("crane").value);
  tow = (isNaN(tow) || tow < 0) ? 0 : Math.floor(tow);
  crane = (isNaN(crane) || crane < 0) ? 0 : Math.floor(crane);

  function f2(n){ return (Math.round(n * 100) / 100).toFixed(2); }

  var h = "";
  h += '<div class="ln">机构：' + area + '</div>';
  h += '<div class="ln">车型：' + car + '</div>';
  h += '<div class="ln">道路组合：' + segs.map(function(s){ return s.road + " " + s.km + " 公里"; }).join(" + ") + '</div>';
  h += '<div class="ln">总里程：' + totalKm + ' 公里</div>';

  h += '<div class="hd">计费明细</div>';
  h += '<div class="ln">起步价：' + startFee + ' 元（取「' + base.road + '」档，含 ' + freeKm + ' 公里，只计一次）</div>';
  for(var q = 0; q < order.length; q++){
    var g2 = order[q];
    h += '<div class="ln sub">' + g2.road + '：' + g2.km + ' 公里'
      + (g2.free > 0 ? '，免费抵扣 ' + g2.free + ' 公里' : '')
+ '，超 ' + g2.over + ' 公里 × ' + g2.rule.p + ' 元/公里 = ' + f2(g2.extra) + ' 元</div>';
  }
  h += '<div class="ln">超里程费小计：' + f2(extraTotal) + ' 元</div>';

  h += '<div class="hd">施救方式（仅登记，不计费）</div>';
  h += '<div class="ln">拖车 ' + tow + ' 台；吊车 ' + crane + ' 台</div>';

  h += '<div class="total">施救费（上限）合计：' + f2(total) + ' 元</div>';
  if(total > 1000){
    h += '<div class="warn">当前施救费金额超阀值，需要机构经理备注核实意见</div>';
  }

  var res = el("result");
  res.innerHTML = h;
  res.style.display = "block";
}

/* ---------- 页内数字小键盘（不依赖系统输入法） ---------- */
var padTarget = null;
var isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

function closestBtn(node){
  while(node && node !== document){
    if(node.tagName === "BUTTON") return node;
    node = node.parentNode;
  }
  return null;
}

function bindNumInput(inp, label, unit){
  if(!inp) return;
  inp.setAttribute("data-label", label);
  inp.setAttribute("data-unit", unit);
  if(!isTouch) return;               // 桌面端保留正常键盘输入
inp.readOnly = true;
  inp.className += " pick";
  inp.addEventListener("click", function(){ openPad(inp); });
}

function openPad(inp){
  padTarget = inp;
  el("padTitle").textContent = "输入" + (inp.getAttribute("data-label") || "");
  el("padUnit").textContent = inp.getAttribute("data-unit") || "";
  el("padNum").textContent = inp.value || "0";
  el("padMask").style.display = "block";
  document.documentElement.style.overflow = "hidden";
  document.body.style.overflow = "hidden";
}

函数 closePad(){
  el("padMask").style.display = "none";
  document.documentElement.style.overflow = "";
  document.body.style.overflow = "";
  填充目标 = 空;
}

函数 padKey(k){
  如果(!padTarget) 返回;
  var v = padTarget.值 || "";
  如果(k === "del"){ v = v.slice(0, -1); }
  else if(k === "clear"){ v = ""; }
  else if(k === "ok"){ closePad(); return; }
  else if(k === "."){
    if(v.indexOf(".") === -1) v = (v === "" ? "0" : v) + ".";
  } else {
    如果(v.长度 >= 7) 返回;
    v = (v === "0") ? k : (v + k);
  }
  padTarget.值 = v;
  el("padNum").textContent = (v === "" ? "0" : v);
}

function initPad(){
  var keys = el("padKeys");
  keys.addEventListener("click", function(e){
    var b = closestBtn(e.target);
    if(!b || !keys.contains(b)) return;
    padKey(b.getAttribute("data-k"));
  });
  el("padOk").addEventListener("click", function(){ padKey("ok"); });
  el("padClear").addEventListener("click", function(){ padKey("clear"); });
  el("padClose").addEventListener("click", closePad);
  el("padMask").addEventListener("click", function(e){ if(e.target === el("padMask")) closePad(); });
  文档.addEventListener("keydown", 函数(e){ 如果(e.keyCode === 27) 关闭面板(); });
}
